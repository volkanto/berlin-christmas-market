<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcf9ea" />
    <meta name="description" content="Berlin Christmas markets by day." />
    <title>Berlin market calendar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calendar-app">
      <header>
        <div>
          <p class="city">BERLIN · 2026 / 27</p>
          <h1>Christmas markets</h1>
        </div>
        <div class="header-actions">
          <button id="today">Today</button
          ><button
            id="theme-toggle"
            class="theme-button"
            aria-label="Switch to dark theme"
            title="Switch to dark theme"
            aria-pressed="false"
          >
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.8 13.1A8.8 8.8 0 0 1 10.9 3.2a8.8 8.8 0 1 0 9.9 9.9Z"
              /></svg
            ><svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </header>
      <section aria-label="Calendar">
        <div class="month-nav">
          <h2 id="month"></h2>
          <div>
            <button id="previous" aria-label="Previous days">
              <svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5" /></svg></button
            ><button id="next" aria-label="Next days">
              <svg viewBox="0 0 24 24"><path d="m10 7 5 5-5 5" /></svg>
            </button>
          </div>
        </div>
        <div
          id="days"
          class="days"
          role="group"
          aria-label="Swipe to browse dates"
        ></div>
      </section>
      <section class="day-markets" aria-label="Markets on selected day">
        <div class="day-heading">
          <h2 id="day-title"></h2>
          <span id="count"></span>
        </div>
        <div id="markets" aria-live="polite"></div>
      </section>
      <section class="refresh-panel" aria-label="Market data">
        <div class="refresh-heading">
          <a
            href="https://www.berlin.de/en/christmas-markets/"
            target="_blank"
            rel="noopener">Berlin.de</a>
          <span id="data-updated"> 6 Nov 2026</span>
        </div>
        <p class="data-note">
          Berlin.de updates are published by GitHub Actions. Refresh reloads the
          latest published data.
          <br />
          The data will be refreshed everyday automatically at 07:00, 12:00 and
          16:00 UTC.
        </p>
      </section>
    </main>
    <script src="leaflet.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script type="module" src="refresh.js"></script>
  </body>
</html>
